name: Deploy Sphinx Docs to S3

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

      env:
      AWS_S3_BUCKET_MAIN: arn:aws:s3:::intern.techsquare.net
      AWS_S3_BUCKET_DEV: arn:aws:s3:::intern-dev.techsquare.net
      AWS_REGION: us-east-1

      steps:
      - name: Checkout code
      uses: actions/checkout@v4

      - name: Set up Python
      uses: actions/setup-python@v5
      with:
      python-version: '3.x'

      - name: Install dependencies
      run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

      - name: Build Sphinx docs
      run: |
      cd docs
      make html

      - name: Deploy to S3
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
      args: --acl public-read --delete
      env:
      AWS_S3_BUCKET: ${{ github.ref == 'refs/heads/main' && env.AWS_S3_BUCKET_MAIN || env.AWS_S3_BUCKET_DEV }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ env.AWS_REGION }}
      SOURCE_DIR: docs/build/html

